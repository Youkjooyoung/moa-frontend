name: Frontend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api-moa.jyyouk.shop/api' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build production artifact
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload verified frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: moa-frontend-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v7
        with:
          name: moa-storybook-${{ github.sha }}
          path: storybook-static
          if-no-files-found: error
          retention-days: 7
