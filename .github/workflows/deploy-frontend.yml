name: Frontend Auto Deploy

on:
  workflow_run:
    workflows: [Frontend CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: moa-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Validate deployment variables
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_FRONTEND_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          CLOUDFRONT_DOMAIN_NAME: ${{ vars.CLOUDFRONT_DOMAIN_NAME }}
        run: |
          set -euo pipefail
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_FRONTEND_BUCKET"
          test -n "$CLOUDFRONT_DISTRIBUTION_ID"
          test -n "$CLOUDFRONT_DOMAIN_NAME"

      - name: Download verified build
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: moa-frontend-dist-${{ github.event.workflow_run.head_sha }}
          path: dist

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Publish static assets
        env:
          AWS_FRONTEND_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
        run: |
          set -euo pipefail
          test -f dist/index.html

          aws s3 sync dist/ "s3://$AWS_FRONTEND_BUCKET" \
            --delete \
            --exclude "index.html" \
            --exclude "assets/*" \
            --cache-control "public,max-age=300"

          if [ -d dist/assets ]; then
            aws s3 sync dist/assets/ "s3://$AWS_FRONTEND_BUCKET/assets" \
              --delete \
              --cache-control "public,max-age=31536000,immutable"
          fi

          aws s3 cp dist/index.html "s3://$AWS_FRONTEND_BUCKET/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-store,no-cache,must-revalidate"

      - name: Invalidate CloudFront
        id: invalidate
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)
          echo "invalidation_id=$invalidation_id" >> "$GITHUB_OUTPUT"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation_id"

      - name: Smoke test production
        env:
          CLOUDFRONT_DOMAIN_NAME: ${{ vars.CLOUDFRONT_DOMAIN_NAME }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 3 \
            "https://$CLOUDFRONT_DOMAIN_NAME/" >/dev/null
          curl --fail --silent --show-error --retry 4 --retry-delay 3 \
            https://moa.jyyouk.shop/ >/dev/null
          curl --silent --show-error --retry 4 --retry-delay 3 \
            --output /dev/null --write-out '%{http_code}' \
            https://api-moa.jyyouk.shop/ | grep -Eq '^(200|401|403)$'
